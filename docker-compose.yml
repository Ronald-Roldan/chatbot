services:
  db:
    image: pgvector/pgvector:pg16
    container_name: electoral-rag-db
    environment:
      POSTGRES_DB: electoral_rag
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis -d electoral_rag"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
